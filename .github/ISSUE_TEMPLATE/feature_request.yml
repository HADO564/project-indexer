name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please skim [ROADMAP.md](https://github.com/HADO564/project-indexer/blob/main/ROADMAP.md) first. It lists what is
        already planned, what is deferred behind a specific trigger, and what has
        been **considered and declined** with reasons — which may already answer
        this, or give you the argument you need to reopen it.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that is awkward today? Describe the situation,
        not the solution — it makes alternatives visible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new detector (Unity, Blender, something else)
        - Opening projects / app discovery
        - The project list or project view
        - The CLI
        - Packaging, updates, or platform support
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
