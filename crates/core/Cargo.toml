[package]
name = "indexer-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "indexer_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
git2 = "0.21.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
parselnk = "0.1"
