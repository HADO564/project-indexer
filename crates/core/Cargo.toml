[package]
# Published as `dexily-core` only because `dexily` on crates.io depends on it;
# it is shared by the app and the CLI and versioned with the app, and both use
# it from this repository, never from the registry.
name = "dexily-core"
version = "0.3.5"
edition = "2021"
description = "The shared core of Project Indexer and dexily: projects, groups, trackers and their SQLite store"
repository = "https://github.com/HADO564/project-indexer"
license-file = "../../LICENSE"

# The package was `indexer-core`; the library keeps its name so the app's and
# the CLI's `use indexer_core::…` stay as they are.
[lib]
name = "indexer_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
git2 = "0.21.0"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
parselnk = "0.1"
