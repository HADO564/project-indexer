[package]
name = "indexer-cli"
# Versioned independently of the desktop app and released as `cli-v<version>`
# tags; see CHANGELOG.md beside this file. Unreleased so far.
version = "0.1.0"
edition = "2021"
description = "Command-line tool and TUI for Project Indexer"
license-file = "../../LICENSE"
publish = false

# The command is `dexily` (decided 2026-10-07); the crate keeps its name.
[[bin]]
name = "dexily"
path = "src/main.rs"

[dependencies]
indexer-core = { path = "../core" }
anyhow = "1"
# Only for the timestamp fields of `--json`'s project shape (`output/json.rs`).
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
# `config_dir()` is what Tauri's `app_config_dir()` is built on, so the CLI
# resolves the same `projects.db` as the app; see `src/paths.rs`.
dirs = "6"
# Hands a path to the system opener (`open`, `start`, the XDG handler). The
# same crate `tauri-plugin-opener` wraps, so the CLI and the app agree.
open = "5"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The terminal's width, so `list`'s table can fill and centre in it.
terminal_size = "0.4"
# How many columns a character takes on screen, so a table lines up around an
# emoji, an icon or a CJK name. Already in the tree through ratatui.
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
