[package]
name = "dexily"
# Versioned independently of the desktop app and released as `dexily-v<version>`
# tags; see CHANGELOG.md beside this file.
version = "0.1.0"
edition = "2021"
description = "Track your projects from the terminal: the command line for Project Indexer"
repository = "https://github.com/HADO564/project-indexer"
readme = "README.md"
license-file = "../../LICENSE"
keywords = ["projects", "cli", "tui", "git", "workspace"]
categories = ["command-line-utilities", "development-tools"]

# What goes in each release archive beside the binary. Listed rather than
# detected: dist resolves `license-file` from the wrong folder and fails.
[package.metadata.dist]
auto-includes = false
include = ["README.md", "CHANGELOG.md", "../../LICENSE"]

[[bin]]
name = "dexily"
path = "src/main.rs"

[dependencies]
# `version` as well as `path`: crates.io resolves it by version, this
# workspace by path.
dexily-core = { path = "../core", version = "0.3.5" }
anyhow = "1"
# Only for the timestamp fields of `--json`'s project shape (`output/json.rs`).
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
# `config_dir()` is what Tauri's `app_config_dir()` is built on, so the CLI
# resolves the same `projects.db` as the app; see `src/paths.rs`.
dirs = "6"
# Hands a path to the system opener (`open`, `start`, the XDG handler). The
# same crate `tauri-plugin-opener` wraps, so the CLI and the app agree.
open = "5"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The terminal's width, so `list`'s table can fill and centre in it.
terminal_size = "0.4"
# How many columns a character takes on screen, so a table lines up around an
# emoji, an icon or a CJK name. Already in the tree through ratatui.
unicode-width = "0.2"
# Lets the observer ignore Ctrl+C while the wrapped command runs, so the
# command decides what Ctrl+C means and dexily lives to report its exit code.
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
